<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pierce Bader</title>
  <style>
    /* Reset & globals */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #fff; }

    /* Navigation Bar */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: flex-end;
      background: rgba(0, 0, 0, 0.6);
      padding: 1rem;
    }
    nav a {
      margin-left: 1.5rem;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    /* Typing animation */
    .typing-container {
      position: absolute;
      top: 30%;
      left: 10%;
      font-size: 1.8rem;
      max-width: 75%;
    }
    .typed-text {
      display: inline;
    }
    .cursor {
      display: inline-block;
      width: 3px;
      background: #fff;
      margin-left: 2px;
      animation: blink 0.7s infinite;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      50.1%, 100% { opacity: 0; }
    }

    /* Footer */
    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #000;
      text-align: center;
      padding: 0.5rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <nav>
    <a href="#about">About</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
  </nav>

  <div class="typing-container">
    Pierce is studying mechanical engineering at Columbia University and <span class="typed-text"></span><span class="cursor"></span>
  </div>

  <footer>
    © 2025 Pierce Bader<br>
    ptb2121@columbia.edu<br>
    Made in the Mudd Basement by a team of untrained pigeons
  </footer>

  <script>
    const texts = [
      "is building UAVs.",
      "is obsessed with aerospace.",
      "is trying to get into running.",
      "believes in strategic planning and decisive action."
    ];

    let count = 0;
    let index = 0;
    let currentText = '';
    let letter = '';

    (function type(){
      if (count === texts.length) {
        count = 0;
      }
      currentText = texts[count];
      letter = currentText.slice(0, ++index);

      document.querySelector(".typed-text").textContent = letter;
      if (letter.length === currentText.length) {
        count++;
        index = 0;
        setTimeout(type, 1500); // shorter linger
      } else {
        setTimeout(type, 75); // faster typing
      }
    }());
  </script>
</body>
</html>
