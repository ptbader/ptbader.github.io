<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Resume</title>
  <style>
    :root { --bg:#000; --fg:#fff; --muted:#c9c9c9; --accent:#0099ff; --surface:#070707; --card:#0c0c0c; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.5; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    main { max-width: 1120px; margin: 0 auto; padding: 1rem 1.25rem 3rem; }
    section { padding: 1.5rem 0; }
    .surface { background: var(--surface); border: 1px solid #1b1b1b; border-radius: 18px; padding: 1.25rem; box-shadow: 0 0 0 1px #111 inset, 0 10px 30px rgba(0,0,0,.45); }

    h1 { font-size: clamp(1.6rem, 3.2vw, 2.4rem); line-height: 1.1; margin: .4rem 0 .75rem; }
    h2 { font-size: clamp(1.2rem, 2.2vw, 1.6rem); line-height: 1.2; margin: 0 0 .8rem; }
    p { margin: .5rem 0; color: #e9e9e9; }
    .muted { color: var(--muted); }

    .back { display: inline-flex; align-items: center; gap: .5rem; border: 1px solid #1f1f1f; background: #0b0b0b; border-radius: 999px; padding: .5rem .9rem; color: #eaeaea; }
    .back span { font-size: 1.1rem; }

    /* Ensure images fit within the container */
    embed, iframe {
      width: 100%;
      height: 700px;
      border: none;
    }
  </style>
</head>
